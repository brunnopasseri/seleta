<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel · Seleta</title>
<link rel="icon" href="icone.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="s" viewBox="0 0 48 48"><path d="M40 7H8v17h32v17H8" fill="none" stroke="currentColor" stroke-width="6.4" stroke-linecap="square"/></symbol>
<symbol id="i-inicio" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9H4z" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
<symbol id="i-galerias" viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="13" y="3" width="8" height="8" fill="currentColor"/><rect x="3" y="13" width="8" height="8" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="13" y="13" width="8" height="8" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
<symbol id="i-clientes" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
<symbol id="i-agenda" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M3 10h18M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.6"/></symbol>
<symbol id="i-financeiro" viewBox="0 0 24 24"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
<symbol id="i-config" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1" stroke="currentColor" stroke-width="1.6"/></symbol>
<symbol id="i-coment" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z" fill="currentColor"/></symbol>
</defs></svg>

<!-- Entrar / criar conta -->
<section id="vEntrar" class="entrar hide">
  <a class="logo" href="index.html"><svg><use href="#s"/></svg>SELETA</a>
  <div class="abas" role="group" aria-label="Acesso">
    <button id="abaEntrar" aria-pressed="true">Entrar</button>
    <button id="abaCriar" aria-pressed="false">Criar conta</button>
  </div>
  <div id="msgEntrar" class="msg hide" role="status"></div>
  <form id="fEntrar">
    <div class="field hide" id="campoNome"><label for="nome">Nome do seu estúdio</label><input id="nome" autocomplete="organization" placeholder="Ex.: Brunno Passeri Fotografia"></div>
    <div class="field"><label for="email">E-mail</label><input id="email" type="email" autocomplete="email" required></div>
    <div class="field"><label for="senha">Senha</label><input id="senha" type="password" autocomplete="current-password" minlength="6" required></div>
    <button class="btn fill" style="width:100%" id="bEntrar">Entrar</button>
  </form>
  <p class="small mute" style="margin-top:16px"><a href="#" id="esqueci">Esqueci minha senha</a></p>
</section>

<section id="vSenha" class="entrar hide">
  <a class="logo" href="index.html"><svg><use href="#s"/></svg>SELETA</a>
  <h1 style="margin:24px 0">Crie uma nova senha</h1>
  <form id="fSenha"><div class="field"><label for="nova">Nova senha</label><input id="nova" type="password" minlength="6" required autocomplete="new-password"></div><button class="btn fill">Salvar senha</button></form>
</section>

<!-- Painel -->
<div id="vPainel" class="painel hide">
  <aside class="lado">
    <a class="logo" href="#/inicio"><svg><use href="#s"/></svg>SELETA</a>
    <nav class="menu" id="menu">
      <a href="#/inicio" data-r="inicio"><svg><use href="#i-inicio"/></svg>Início</a>
      <a href="#/galerias" data-r="galerias"><svg><use href="#i-galerias"/></svg>Galerias</a>
      <a href="#/clientes" data-r="clientes"><svg><use href="#i-clientes"/></svg>Clientes</a>
      <a href="#/agenda" data-r="agenda"><svg><use href="#i-agenda"/></svg>Agenda</a>
      <a href="#/financeiro" data-r="financeiro"><svg><use href="#i-financeiro"/></svg>Financeiro</a>
      <a href="#/config" data-r="config"><svg><use href="#i-config"/></svg>Configurações</a>
    </nav>
    <div class="ladoPe">
      <div class="uso" id="uso"></div>
      <div class="small" id="nomeEstudio"></div>
      <button class="link-btn small" id="sair">Sair</button>
    </div>
  </aside>
  <main class="conteudo" id="conteudo" tabindex="-1"></main>
</div>

<div id="modal" class="modal hide" role="dialog" aria-modal="true" aria-labelledby="modalTitulo"><div class="modalCaixa" id="modalCaixa"></div></div>
<div id="toast" class="toast hide" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
